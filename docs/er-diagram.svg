<text x="40" y="862" font-size="12.5" font-weight="700" fill="#0f172a">Legend</text>
<text x="40" y="880" font-size="11.5" fill="#334155">PK = primary key   FK = foreign key   UQ = unique   CK = CHECK constraint   UQ* = unique together with user_id / with each other</text>
<text x="40" y="897" font-size="11.5" fill="#334155">Relationship lines: a single bar marks the &quot;one&quot; side, the three-pronged end marks the &quot;many&quot; side.   Every business table also carries user_id, so each account only sees its own data.</text>
<text x="40" y="914" font-size="11.5" fill="#334155">ON DELETE: orders &#8594; order_items / payments / order_status_history = CASCADE;   customers, products used by an order = RESTRICT (the database refuses the delete).</text>
<text x="40" y="931" font-size="11.5" fill="#334155">CHECK rules: price &#8805; 0 &#183; quantity &gt; 0 &#183; unit_price &#8805; 0 &#183; total_amount &#8805; 0 &#183; payment amount &#8805; 0 &#183; customer email must contain @ and a dot.</text>
</svg>